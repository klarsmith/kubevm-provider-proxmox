name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Not go.mod's version: go.mod states the oldest Go the module
          # builds with; the tools and the release image use the newest.
          go-version: stable
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: make verify
      - run: make lint
      - run: make test

  # The module must keep building with the Go version go.mod promises.
  build-min-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOTOOLCHAIN: local
