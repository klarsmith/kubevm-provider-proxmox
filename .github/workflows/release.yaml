# Pushing a tag vX.Y.Z builds and pushes the multi-arch manager image, and
# publishes a GitHub release whose notes are that version's CHANGELOG.md
# section. Tag only after the changelog has a "## [X.Y.Z]" heading.
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Render install manifest
        run: |
          sed "s|ghcr.io/klarsmith/kubevm-provider-proxmox:dev|ghcr.io/${{ github.repository }}:${{ github.ref_name }}|" \
            config/manager/manager.yaml > config/manager/manager.release.yaml
          mv config/manager/manager.release.yaml config/manager/manager.yaml
          kubectl kustomize config > install.yaml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --notes-file notes.md --title "${GITHUB_REF_NAME}" install.yaml
