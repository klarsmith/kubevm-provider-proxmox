---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - infrastructure.kube-vm.io
  resources:
  - proxmoxmachines
  verbs:
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infrastructure.kube-vm.io
  resources:
  - proxmoxmachines/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - kube-vm.io
  resources:
  - virtualmachines
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - kube-vm.io
  resources:
  - virtualmachines/finalizers
  verbs:
  - update
- apiGroups:
  - kube-vm.io
  resources:
  - virtualmachines/status
  verbs:
  - get
  - patch
