apiVersion: v1
kind: Namespace
metadata:
  name: kubevm-proxmox-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller-manager
  namespace: kubevm-proxmox-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: kubevm-proxmox-system
  labels:
    app.kubernetes.io/name: kubevm-provider-proxmox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubevm-provider-proxmox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubevm-provider-proxmox
    spec:
      serviceAccountName: controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/klarsmith/kubevm-provider-proxmox:dev
          args:
            - --allowed-pool=kubevm-dev
            - --leader-elect
            - --health-probe-bind-address=:8081
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
